name: Java tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verificar parser e gate do summary
        run: python3 scripts/summary.py --self-test
      - name: Verificar arquivos versionados
        shell: bash
        run: |
          tracked=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked" ]; then
            printf 'Arquivos ignorados versionados:\n%s\n' "$tracked"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: cp .env.example .env
      - run: mvn -B -ntp verify
        id: tests
      - name: Resumo dos testes e completude
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          EXPECTED_TESTS: '25'
          JUNIT_PATTERN: 'target/surefire-reports/TEST-*.xml'
          SUMMARY_FILE: 'target/surefire-reports/summary.md'
          TEST_SCOPE: 'Java 21 / WireMock. API virtualizada; nenhum provedor de frete real.'
        run: python3 scripts/summary.py
      - uses: actions/upload-artifact@v4
        id: artifact
        if: always()
        with:
          name: junit-results
          path: target/surefire-reports/
          retention-days: 7
          if-no-files-found: error
      - name: Link dos resultados
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Baixar relatórios e evidências](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            printf '\nArtifact indisponível; confira a etapa de upload.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
